browser:
  browser: chromium
  headless: false
  persistent_profile: "./runtime/browser-profile"
  navigation_timeout_ms: 30000

target:
  start_url: "https://authorized.example/internal-test"

authentication:
  mode: manual
  authenticated_selector: '[data-testid="dashboard"]'
  wait_timeout_seconds: 300

selectors:
  challenge_image: '[data-testid="verification-image"]'
  challenge_input: '[data-testid="verification-input"]'
  continue_button: '[data-testid="continue-button"]'
  success_element: '[data-testid="next-step"]'
  rejection_element: '[data-testid="verification-error"]'

ocr:
  model: "PP-OCRv5_mobile_rec"
  min_confidence: 0.85
  expected_regex: "^[A-Z0-9]{5}$"
  lang: "en"
  max_attempts: 3

preprocessing:
  variants:
    - raw
    - upscale
    - grayscale_contrast

workflow:
  target_wait_timeout_seconds: 30
  page_retry_limit: 2
  navigation_retry_limit: 2
  submit_retry_limit: 1
  post_submit_timeout_seconds: 15
  capture_retry_limit: 2

artifacts:
  save_failures: true
  save_success_images: false
  root: "./artifacts"